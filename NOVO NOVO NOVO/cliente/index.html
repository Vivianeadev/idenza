<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDEnza Intelligence Platform — Painel do Cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .model-dot.active-model { box-shadow: 0 0 12px 2px rgba(200, 122, 79, 0.6); animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 8px 1px rgba(200, 122, 79, 0.4); } 50% { box-shadow: 0 0 16px 4px rgba(200, 122, 79, 0.7); } 100% { box-shadow: 0 0 8px 1px rgba(200, 122, 79, 0.4); } }
        .forgot-password-link { display: block; text-align: right; font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem; text-decoration: none; opacity: 0.7; }
        .forgot-password-link:hover { opacity: 1; color: var(--accent); }
        .reset-success { color: #4caf50; font-size: 0.75rem; text-align: center; margin-top: 0.5rem; }
        .login-overlay { z-index: 1000; }
        .modal-overlay { z-index: 2000; }
        .modal-overlay.active { display: flex !important; }
        
        /* Câmera */
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #c87a4f;
            box-shadow: 0 0 20px rgba(200, 122, 79, 0.3);
        }
        .camera-container video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }
        .camera-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; height: 250px;
            border: 2px dashed rgba(255,255,255,0.6);
            border-radius: 50%;
            pointer-events: none;
        }
        .camera-status {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 0.5rem;
            color: var(--text-muted);
        }
        .camera-dot {
            display: inline-block;
            width: 8px; height: 8px;
            background: #ff4444;
            border-radius: 50%;
            animation: blink 1s infinite;
            margin-right: 5px;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="login-overlay" style="z-index: 1000;">
    <div class="login-box">
        <h2>IDEnza</h2>
        <p class="subtle">Acesse seu ambiente inteligente</p>
        <div class="login-tabs">
            <button class="login-tab active" data-method="email">E‑mail</button>
            <button class="login-tab" data-method="apikey">Chave de Acesso</button>
        </div>
        <div id="login-panel-email" class="login-panel active">
            <form id="login-form-email">
                <div class="form-group"><label>E‑mail</label><input type="email" id="login-email" required></div>
                <div class="form-group"><label>Senha</label><input type="password" id="login-password" required></div>
                <a href="#" class="forgot-password-link" id="link-esqueceu-senha">Esqueceu a senha?</a>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
        </div>
        <div id="login-panel-apikey" class="login-panel">
            <form id="login-form-apikey">
                <div class="form-group"><label>Chave de Acesso</label><input type="text" id="apikey-input" required></div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
        </div>
        <div class="login-error" id="login-error"></div>
    </div>
</div>

<!-- MODAL RESET COM CÂMERA -->
<div class="modal-overlay" id="modal-esqueceu-senha" style="z-index: 2000;">
    <div class="modal" style="max-width: 480px;">
        <h3>Recuperação Segura</h3>
        
        <!-- ETAPA 1: CNPJ -->
        <div id="etapa1-cnpj">
            <p style="color:var(--text-muted); font-size:0.8rem;">Digite o CNPJ cadastrado para iniciar.</p>
            <form id="form-cnpj">
                <div class="form-group">
                    <label>CNPJ</label>
                    <input type="text" id="reset-cnpj" placeholder="00.000.000/0000-00" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Continuar</button>
                </div>
            </form>
            <div id="msg-cnpj" style="display:none; text-align:center;"></div>
        </div>
        
        <!-- ETAPA 2: BIOMETRIA -->
        <div id="etapa2-biometria" style="display:none;">
            <p style="text-align:center; color:var(--text-muted); font-size:0.8rem;">Centralize seu rosto e capture</p>
            <div class="camera-container">
                <video id="camera-video" autoplay playsinline></video>
                <div class="camera-overlay"></div>
            </div>
            <div class="camera-status">
                <span class="camera-dot"></span> Câmera ativa
            </div>
            <canvas id="camera-canvas" style="display:none;"></canvas>
            <p style="text-align:center; margin-top:15px;">
                <button type="button" class="btn btn-primary" id="btn-capturar">📸 Capturar Rosto</button>
            </p>
            <div id="msg-biometria" style="display:none; text-align:center;"></div>
        </div>
        
        <!-- ETAPA 3: CÓDIGO -->
        <div id="etapa3-codigo" style="display:none;">
            <p style="text-align:center; color:#4caf50; font-size:0.8rem;">✅ Identidade verificada!</p>
            <p style="text-align:center; color:var(--text-muted); font-size:0.75rem;">O código foi enviado para o responsável.</p>
            <form id="form-codigo">
                <input type="hidden" id="cnpj-final">
                <div class="form-group">
                    <label>Código de Verificação</label>
                    <input type="text" id="reset-codigo" placeholder="XXXX-XXXX" required maxlength="9">
                </div>
                <div class="form-group">
                    <label>Nova Senha</label>
                    <input type="password" id="reset-senha" required minlength="8" placeholder="Mínimo 8 caracteres">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Redefinir Senha</button>
                </div>
            </form>
            <div id="msg-codigo" style="display:none; text-align:center;"></div>
        </div>
    </div>
</div>

<script>
(() => {

// ====== CONFIG ======
const API_BASE = 'https://idenza-api.avizaecosystem.workers.dev';
const EMAIL_API = 'https://idenza-email-api.avz9-aproptech.workers.dev';
const EMAIL_TOKEN = 'Bearer idenza2024';
const ADMIN_EMAIL = 'vivianebazante@gmail.com';

// ====== CÂMERA ======
let stream = null;

async function abrirCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user", width: 640, height: 480 } 
        });
        document.getElementById('camera-video').srcObject = stream;
        document.getElementById('etapa1-cnpj').style.display = 'none';
        document.getElementById('etapa2-biometria').style.display = 'block';
    } catch (err) {
        alert('❌ Permita o acesso à câmera para continuar.');
    }
}

function pararCamera() {
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
}

function gerarCodigo() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let c = '';
    for (let i = 0; i < 8; i++) {
        if (i === 4) c += '-';
        c += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return c;
}

function abrirModal() {
    document.getElementById('login-overlay').style.display = 'none';
    const m = document.getElementById('modal-esqueceu-senha');
    m.classList.add('active');
    m.style.display = 'flex';
    document.getElementById('etapa1-cnpj').style.display = 'block';
    document.getElementById('etapa2-biometria').style.display = 'none';
    document.getElementById('etapa3-codigo').style.display = 'none';
    document.getElementById('msg-cnpj').style.display = 'none';
    document.getElementById('msg-biometria').style.display = 'none';
    document.getElementById('msg-codigo').style.display = 'none';
}

function fecharModal() {
    pararCamera();
    const m = document.getElementById('modal-esqueceu-senha');
    m.classList.remove('active');
    m.style.display = 'none';
    document.getElementById('login-overlay').style.display = 'flex';
}

// ====== ETAPA 1: CNPJ ======
document.getElementById('form-cnpj').addEventListener('submit', async (e) => {
    e.preventDefault();
    const cnpj = document.getElementById('reset-cnpj').value.replace(/\D/g, '');
    const msg = document.getElementById('msg-cnpj');
    
    if (cnpj.length !== 14) {
        msg.style.display = 'block';
        msg.textContent = '❌ CNPJ inválido';
        msg.style.color = '#ff4444';
        return;
    }
    
    msg.style.display = 'block';
    msg.textContent = '⏳ Verificando...';
    msg.style.color = 'var(--text-muted)';
    
    try {
        const res = await fetch(`${API_BASE}/api/check-cnpj`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cnpj })
        });
        const data = await res.json();
        
        if (data.exists) {
            abrirCamera();
        } else {
            msg.textContent = '❌ CNPJ não encontrado';
            msg.style.color = '#ff4444';
        }
    } catch (err) {
        msg.textContent = '❌ Erro de conexão';
        msg.style.color = '#ff4444';
    }
});

// ====== ETAPA 2: CAPTURAR ROSTO ======
document.getElementById('btn-capturar').addEventListener('click', async () => {
    const video = document.getElementById('camera-video');
    const canvas = document.getElementById('camera-canvas');
    const msg = document.getElementById('msg-biometria');
    
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    const foto = canvas.toDataURL('image/jpeg', 0.8);
    const cnpj = document.getElementById('reset-cnpj').value.replace(/\D/g, '');
    
    msg.style.display = 'block';
    msg.textContent = '🔍 Analisando rosto...';
    msg.style.color = 'var(--text-muted)';
    
    try {
        const res = await fetch(`${API_BASE}/api/verify-face`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cnpj, foto })
        });
        const data = await res.json();
        
        if (data.match) {
            msg.textContent = '✅ Rosto reconhecido!';
            msg.style.color = '#4caf50';
            
            const codigo = gerarCodigo();
            
            // 📧 ENVIA EMAIL PARA VOCÊ VIA WORKER
            await fetch(`${EMAIL_API}/api/send`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': EMAIL_TOKEN
                },
                body: JSON.stringify({
                    to: ADMIN_EMAIL,
                    subject: `🔐 RESET - ${data.nome || 'Cliente'}`,
                    htmlBody: `
                        <div style="font-family:Arial;padding:20px;border-left:4px solid #4caf50;">
                            <h2>✅ Verificação Facial Aprovada</h2>
                            <p><strong>CNPJ:</strong> ${cnpj}</p>
                            <p><strong>Empresa:</strong> ${data.nome || 'N/A'}</p>
                            <p><strong>CÓDIGO:</strong> <span style="font-size:28px;color:#c87a4f;">${codigo}</span></p>
                            <hr>
                            <p style="color:#666;">Envie este código para o cliente.</p>
                        </div>
                    `
                })
            });
            
            pararCamera();
            
            setTimeout(() => {
                document.getElementById('etapa2-biometria').style.display = 'none';
                document.getElementById('etapa3-codigo').style.display = 'block';
                document.getElementById('cnpj-final').value = cnpj;
            }, 1500);
            
        } else {
            msg.textContent = '❌ Rosto não reconhecido';
            msg.style.color = '#ff4444';
        }
    } catch (err) {
        msg.textContent = '❌ Erro na verificação';
        msg.style.color = '#ff4444';
    }
});

// ====== ETAPA 3: CÓDIGO + NOVA SENHA ======
document.getElementById('form-codigo').addEventListener('submit', async (e) => {
    e.preventDefault();
    const cnpj = document.getElementById('cnpj-final').value;
    const codigo = document.getElementById('reset-codigo').value.toUpperCase();
    const senha = document.getElementById('reset-senha').value;
    const msg = document.getElementById('msg-codigo');
    
    if (senha.length < 8) {
        msg.style.display = 'block';
        msg.textContent = '❌ Senha muito curta';
        msg.style.color = '#ff4444';
        return;
    }
    
    msg.style.display = 'block';
    msg.textContent = '⏳ Redefinindo...';
    msg.style.color = 'var(--text-muted)';
    
    try {
        const res = await fetch(`${API_BASE}/api/reset-password-cnpj`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cnpj, codigo, novaSenha: senha })
        });
        const data = await res.json();
        
        if (data.success) {
            msg.textContent = '✅ Senha redefinida! Faça login.';
            msg.style.color = '#4caf50';
            setTimeout(fecharModal, 3000);
        } else {
            msg.textContent = '❌ Código inválido ou expirado';
            msg.style.color = '#ff4444';
        }
    } catch (err) {
        msg.textContent = '❌ Erro de conexão';
        msg.style.color = '#ff4444';
    }
});

// ====== EVENT LISTENERS ======
document.getElementById('link-esqueceu-senha').addEventListener('click', (e) => {
    e.preventDefault();
    abrirModal();
});

document.getElementById('btn-cancelar').addEventListener('click', fecharModal);

document.getElementById('modal-esqueceu-senha').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) fecharModal();
});

})();
</script>

</body>
</html>
