<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Idenza Robotics Academy — Construa robôs reais open source com passo a passo completo, código-fonte e lista de materiais.">
    <meta name="theme-color" content="#0a3147">
    <title>Idenza Robotics Academy | Construa Robôs Reais</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Marcellus&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #0a3147;
            --gold: #D4AF37;
            --gold-dark: #B8860B;
            --gold-light: #F4E4B8;
            --text: #2b2b2b;
            --text-light: #4a4a4a;
            --white: #ffffff;
            --bg: linear-gradient(135deg, #f9f5f0 0%, #faf0f4 100%);
            --critical: #c62828;
            --warning: #e65100;
            --success: #2e7d32;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
            --shadow-hover: 0 15px 40px rgba(10,49,71,0.12);
            --radius: 16px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: linear-gradient(180deg, var(--primary) 0%, #1a4b6d 100%);
            color: var(--white);
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--gold-dark));
        }
        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
            color: var(--white);
        }
        .header h1 i { color: var(--gold); margin-right: 10px; }
        .header .subtitle {
            font-family: 'Marcellus', serif;
            color: var(--gold-light);
            font-size: 1.1rem;
            letter-spacing: 2px;
            opacity: 0.9;
        }
        .header .counter {
            margin-top: 1.5rem;
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* CONTAINER */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* FILTROS */
        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 2rem;
            align-items: center;
        }
        .filtro-btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(212,175,55,0.3);
            background: var(--white);
            color: var(--text);
            font-family: 'Marcellus', serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        .filtro-btn:hover, .filtro-btn.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--white);
            border-color: var(--gold);
        }
        .busca-input {
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid rgba(212,175,55,0.3);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            flex: 1;
            min-width: 200px;
            max-width: 350px;
            margin-left: auto;
        }
        .busca-input:focus {
            outline: 2px solid var(--gold);
            border-color: var(--gold);
        }

        /* GRID DE ROBÔS */
        .robos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }
        .robo-card {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid rgba(212,175,55,0.12);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .robo-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--gold);
        }
        .robo-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--gold-dark));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }
        .robo-card:hover::before {
            transform: scaleX(1);
        }
        .robo-card .robo-icon {
            font-size: 2.2rem;
            margin-bottom: 0.8rem;
        }
        .robo-card h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 0.3rem;
            letter-spacing: 1px;
        }
        .robo-card .robo-tipo {
            font-family: 'Marcellus', serif;
            color: var(--text-light);
            font-size: 0.75rem;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .robo-card .robo-desc {
            font-size: 0.82rem;
            color: var(--text-light);
            line-height: 1.5;
            flex: 1;
            margin-bottom: 1rem;
        }
        .robo-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }
        .robo-tag {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-family: 'Marcellus', serif;
            letter-spacing: 0.5px;
            background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.2);
            color: var(--gold-dark);
        }
        .robo-tag.facil { background: rgba(46,125,50,0.08); border-color: rgba(46,125,50,0.2); color: var(--success); }
        .robo-tag.medio { background: rgba(230,81,0,0.06); border-color: rgba(230,81,0,0.2); color: var(--warning); }
        .robo-tag.avancado { background: rgba(198,40,40,0.06); border-color: rgba(198,40,40,0.2); color: var(--critical); }
        .robo-tag.especialista { background: rgba(10,49,71,0.06); border-color: rgba(10,49,71,0.2); color: var(--primary); }

        .robo-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            text-align: center;
        }
        .robo-btn:hover {
            box-shadow: 0 8px 25px rgba(212,175,55,0.3);
            transform: translateY(-2px);
        }

        /* VAZIO */
        .vazio {
            text-align: center;
            padding: 4rem 2rem;
            grid-column: 1 / -1;
        }
        .vazio i {
            font-size: 4rem;
            color: var(--gold);
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        .vazio h3 {
            font-family: 'Cinzel', serif;
            color: var(--primary);
        }

        /* FOOTER */
        .footer {
            background: var(--primary);
            color: rgba(255,255,255,0.6);
            text-align: center;
            padding: 2rem;
            font-size: 0.7rem;
            font-family: 'Marcellus', serif;
            letter-spacing: 1px;
            margin-top: 4rem;
        }
        .footer strong { color: var(--gold); }

        @media (max-width: 768px) {
            .header { padding: 2rem 1rem; }
            .header h1 { font-size: 1.4rem; }
            .container { padding: 1rem; }
            .robos-grid { grid-template-columns: 1fr; }
            .filtros { flex-direction: column; align-items: stretch; }
            .busca-input { max-width: 100%; margin-left: 0; }
        }
    </style>
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header class="header">
        <h1><i class="fas fa-robot"></i> Idenza Robotics Academy</h1>
        <p class="subtitle">Construa Robôs Reais • Open Source • Passo a Passo</p>
        <p class="counter" id="contadorRobos">Carregando catálogo...</p>
    </header>

    <!-- ==================== CONTEÚDO PRINCIPAL ==================== -->
    <main class="container">

        <!-- Filtros -->
        <div class="filtros" id="filtrosContainer">
            <button class="filtro-btn active" data-filtro="todos">Todos os Robôs</button>
            <button class="filtro-btn" data-filtro="fácil">🟢 Fácil</button>
            <button class="filtro-btn" data-filtro="médio">🟡 Médio</button>
            <button class="filtro-btn" data-filtro="avançado">🔴 Avançado</button>
            <button class="filtro-btn" data-filtro="especialista">⚫ Especialista</button>
            <input type="text" class="busca-input" id="buscaInput" placeholder="🔍 Buscar robô...">
        </div>

        <!-- Grid de Robôs -->
        <div class="robos-grid" id="robosGrid">
            <!-- Preenchido dinamicamente -->
        </div>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="footer">
        <strong>Idenza Robotics Academy™</strong> — Todos os robôs são open source e podem ser construídos por qualquer pessoa.<br>
        © 2026 Idenza Robotics Intelligence S.A. — Build v6.0.0
    </footer>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="projetos/data/robos-database.js"></script>
    <script>
        (function() {
            const robos = window.IDENZA_ROBOS_DATABASE || [];
            const grid = document.getElementById('robosGrid');
            const contador = document.getElementById('contadorRobos');
            const buscaInput = document.getElementById('buscaInput');
            let filtroAtivo = 'todos';

            // Atualiza contador
            contador.textContent = `${robos.length} robôs open source disponíveis para construir`;

            // Ícones por tipo de robô
            const icones = {
                'Humanoide': 'fas fa-child',
                'Braço': 'fas fa-hand-holding',
                'Rover': 'fas fa-car',
                'Quadrúpede': 'fas fa-dog',
                'Diferencial': 'fas fa-car-side',
            };

            function getIcone(tipo) {
                for (const [key, icon] of Object.entries(icones)) {
                    if (tipo.includes(key)) return icon;
                }
                return 'fas fa-robot';
            }

            function getTagClass(dificuldade) {
                const map = {
                    'fácil': 'facil',
                    'médio': 'medio',
                    'avançado': 'avancado',
                    'especialista': 'especialista',
                };
                return map[dificuldade] || '';
            }

            function renderizarRobos(filtro = 'todos', busca = '') {
                let filtrados = [...robos];

                // Aplicar filtro de dificuldade
                if (filtro !== 'todos') {
                    filtrados = filtrados.filter(r => r.dificuldade === filtro);
                }

                // Aplicar busca
                if (busca.trim()) {
                    const q = busca.toLowerCase().trim();
                    filtrados = filtrados.filter(r =>
                        r.nome.toLowerCase().includes(q) ||
                        r.tipo.toLowerCase().includes(q) ||
                        r.descricao.toLowerCase().includes(q) ||
                        r.dificuldade.toLowerCase().includes(q)
                    );
                }

                // Atualizar grid
                if (filtrados.length === 0) {
                    grid.innerHTML = `
                        <div class="vazio">
                            <i class="fas fa-search"></i>
                            <h3>Nenhum robô encontrado</h3>
                            <p>Tente outro filtro ou termo de busca.</p>
                        </div>`;
                } else {
                    grid.innerHTML = filtrados.map(robo => `
                        <div class="robo-card" onclick="window.open('projetos/template.html?id=${robo.id}', '_blank')">
                            <div class="robo-icon">
                                <i class="${getIcone(robo.tipo)}" style="color:var(--gold);"></i>
                            </div>
                            <h3>${robo.nome}</h3>
                            <p class="robo-tipo">${robo.tipo}</p>
                            <p class="robo-desc">${robo.descricao.substring(0, 140)}...</p>
                            <div class="robo-meta">
                                <span class="robo-tag ${getTagClass(robo.dificuldade)}">${robo.dificuldade.toUpperCase()}</span>
                                <span class="robo-tag"><i class="fas fa-clock"></i> ${robo.tempo}</span>
                                <span class="robo-tag"><i class="fas fa-dollar-sign"></i> ${robo.custo}</span>
                                <span class="robo-tag"><i class="fas fa-cubes"></i> ${robo.pecas} peças</span>
                                ${robo.impressao3d ? '<span class="robo-tag"><i class="fas fa-cube"></i> Impressão 3D</span>' : ''}
                            </div>
                            <a href="projetos/template.html?id=${robo.id}" target="_blank" class="robo-btn" onclick="event.stopPropagation();">
                                <i class="fas fa-external-link-alt"></i> Abrir Projeto Completo
                            </a>
                        </div>
                    `).join('');
                }

                // Atualizar contador
                contador.textContent = `${filtrados.length} de ${robos.length} robôs exibidos`;
            }

            // Eventos dos filtros
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    filtroAtivo = this.dataset.filtro;
                    renderizarRobos(filtroAtivo, buscaInput.value);
                });
            });

            // Evento de busca
            buscaInput.addEventListener('input', function() {
                renderizarRobos(filtroAtivo, this.value);
            });

            // Renderizar inicial
            renderizarRobos();
        })();
    </script>

</body>
</html>
